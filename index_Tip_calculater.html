<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="Tip_calculater.css">
    <script src="Tip_calculater.js" defer></script>
</head>
<body>
    <div>
        <h1>Tip Calculator</h1>
        <p> Enter the bill amount and tip percentage to calculater</p>
        <label for="bill">Bill amount:</label>
        <input type="number" id="bill"  required>
        <label for="tip">Tip percentage:</label>
        <input type="number" id="tip" required>
        <button id="btn">Calculate</button>
        <label for="sum">Total amount:  <span id="sum"></span></label>
        
        
    
    </div>

</body>
</html>
